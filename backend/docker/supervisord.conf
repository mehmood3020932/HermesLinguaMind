; =============================================================================
; Hermes LinguaMind — supervisord config for the single all-in-one backend
; container. Every service below is an independent uvicorn process on its
; own localhost port, exactly like it would be in its own container — the
; only difference is they all now share one image/filesystem instead of 22.
; =============================================================================

[supervisord]
nodaemon=true
user=hermes
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:api_gateway]
directory=/app/services/api_gateway
command=/opt/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startretries=5
startsecs=3
stopsignal=TERM
stdout_logfile=/var/log/supervisor/api_gateway.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/var/log/supervisor/api_gateway.err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1
priority=50

