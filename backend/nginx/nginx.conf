# Hermes LinguaMind — Nginx reverse proxy
# Public :80 → unified adapter :8080

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'rid=$http_x_request_id';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    upstream hermes_adapter {
        server hermes_backend:8080;
        keepalive 32;
    }

    # Docker's embedded DNS — used (instead of a static `upstream` block)
    # for the avatar routes below so nginx resolves them at REQUEST time,
    # not at startup. avatar_api/avatar_web only exist when the optional
    # `avatar` compose profile is running; a static upstream referencing a
    # hostname that doesn't exist at all would make nginx refuse to start
    # (`host not found in upstream`), taking the ENTIRE stack down over an
    # optional feature. This way, hitting /avatar-api/ when the profile
    # isn't running just 502s instead.
    resolver 127.0.0.11 valid=30s;

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer-when-downgrade always;

        location /health {
            proxy_pass http://hermes_adapter/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
        }

        # Static frontend (single-page test/demo client) — served directly
        # by nginx, no separate container, keeps the whole stack tiny.
        location /app/ {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /app/index.html;
            add_header Cache-Control "public, max-age=3600";
        }
        location = /app {
            return 301 /app/;
        }

        location / {
            proxy_pass http://hermes_adapter;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # OpenTalking API (optional `avatar` profile) — the Flutter client
        # opens its WebRTC/SSE connection directly against this path using
        # the opentalking_session_id handed back by
        # /v1/avatar_service/sessions. See AVATAR_INTEGRATION.md.
        location /avatar-api/ {
            set $avatar_api_upstream avatar_api:8000;
            proxy_pass http://$avatar_api_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;  # long-lived SSE/WebRTC signaling
        }

        # OpenTalking's own WebUI (optional `avatar` profile) — useful for
        # testing/demoing avatars directly without going through the app.
        location /avatar-web/ {
            set $avatar_web_upstream avatar_web:80;
            proxy_pass http://$avatar_web_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # WebSocket support (live conversation via adapter proxy)
        location /svc/live/ {
            proxy_pass http://hermes_adapter;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }
    }
}
