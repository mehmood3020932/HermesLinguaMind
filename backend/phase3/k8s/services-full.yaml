# Auto-generated: Deployment + Service + HPA + PodDisruptionBudget for every
# Hermes microservice. Sized in 3 tiers by expected traffic:
#   Tier A (gateway/LLM/live-conversation): 5-60 replicas
#   Tier B (per-request compute services):   3-30 replicas
#   Tier C (light/background services):      2-15 replicas
# Apply with: kubectl apply -f phase3/k8s/
# NOTE: these numbers are a sizing STARTING POINT based on typical
# request-processing costs per service, not a load-tested guarantee.
# Reaching 2M real users also needs: DB read replicas / connection
# pooling (pgbouncer), Redis Cluster, a CDN in front of static/TTS
# audio, and an actual load test (k6/Locust) to tune these targets —
# that verification was NOT run in this environment (no cluster access).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-api-gateway
  namespace: hermes-production
  labels:
    app: hermes
    service: api-gateway
    version: v3.1.0
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hermes
      service: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: '0'
  template:
    metadata:
      labels:
        app: hermes
        service: api-gateway
        version: v3.1.0
    spec:
      containers:
      - name: api-gateway
        image: hermes/api-gateway:v3.1.0
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: hermes-config
        - secretRef:
            name: hermes-secrets
        env:
        - name: PORT
          value: '8000'
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: hermes
            service: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-api-gateway
  namespace: hermes-production
  labels:
    app: hermes
    service: api-gateway
spec:
  selector:
    app: hermes
    service: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hermes-api-gateway-hpa
  namespace: hermes-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes-api-gateway
  minReplicas: 5
  maxReplicas: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hermes-api-gateway-pdb
  namespace: hermes-production
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app: hermes
      service: api-gateway
