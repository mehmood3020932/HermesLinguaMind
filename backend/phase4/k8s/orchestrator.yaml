# Hermes Orchestrator — the platform's MAIN BRAIN (Layer 2-5:
# Intent -> Plan -> Execute -> Verify). Every /v1/chat request from the
# API Gateway is routed here first; it decides which of the 20+
# microservices to call and in what order. Kept at a higher baseline
# replica count (5) and highest HPA ceiling (60) since every user
# interaction passes through it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-orchestrator
  namespace: hermes-production
  labels:
    app: hermes
    service: hermes-orchestrator
    role: main-brain
    version: v4.0.0
spec:
  replicas: 5
  selector:
    matchLabels:
      app: hermes
      service: hermes-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: '0'
  template:
    metadata:
      labels:
        app: hermes
        service: hermes-orchestrator
        role: main-brain
        version: v4.0.0
    spec:
      containers:
      - name: hermes-orchestrator
        image: hermes/orchestrator:v4.0.0
        ports:
        - containerPort: 8020
          name: http
        envFrom:
        - configMapRef:
            name: hermes-config
        - secretRef:
            name: hermes-secrets
        env:
        - name: PORT
          value: '8020'
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 20
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8020
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: hermes
            service: hermes-orchestrator
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-orchestrator
  namespace: hermes-production
  labels:
    app: hermes
    service: hermes-orchestrator
spec:
  selector:
    app: hermes
    service: hermes-orchestrator
  ports:
  - port: 8020
    targetPort: 8020
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hermes-orchestrator-hpa
  namespace: hermes-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hermes-orchestrator
  minReplicas: 5
  maxReplicas: 60
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 4
        periodSeconds: 30
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hermes-orchestrator-pdb
  namespace: hermes-production
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app: hermes
      service: hermes-orchestrator
