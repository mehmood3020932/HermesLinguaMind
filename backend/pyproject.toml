[project]
name = "hermes-linguamind-backend"
version = "1.0.0"
description = "Hermes LinguaMind — unified backend (gateway + 22 services + orchestrator)"
requires-python = ">=3.11"
readme = "README.md"

# Single source of truth for every dependency needed by ANY process the
# backend image runs (gateway, all phase3 services, phase4 orchestrator,
# celery worker). Supersedes: requirements.txt, requirements-all.txt,
# requirements-ml.txt, phase3/requirements-phase3.txt,
# phase4/requirements-phase4.txt, phase4/requirements-orchestrator.txt —
# all deleted. Those six files had zero real version conflicts (everyone
# already agreed on fastapi==0.111.0 / pydantic==2.8.2 / uvicorn==0.30.1),
# so this merge is pin-for-pin identical to what requirements-all.txt
# already installed; it just removes the duplication and stray
# reference-only files (phase3/4's had drifted, unused, torch-heavy
# copies — see the git history of this repo for why they existed).
dependencies = [
    # --- Web framework / server ---
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "gunicorn==22.0.0",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "python-multipart==0.0.9",

    # --- HTTP / networking ---
    "httpx==0.27.0",
    "websockets==12.0",
    "tenacity==8.5.0",

    # --- Database ---
    "sqlalchemy==2.0.31",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "psycopg2-binary==2.9.9",

    # --- Cache / queue ---
    "redis==5.0.7",
    "celery==5.4.0",

    # --- Auth / security ---
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "cryptography==42.0.8",

    # --- Observability / utils ---
    "structlog==24.2.0",
    "prometheus-client==0.20.0",
    "python-dotenv==1.0.1",
    "orjson==3.10.6",

    # --- Messaging / search (optional extras, safe without ES/Rabbit running) ---
    "aio-pika==9.4.2",
    "elasticsearch==8.14.0",

    # --- Email + push notifications (open-source, no paid API required) ---
    "aiosmtplib==3.0.2",
    "jinja2==3.1.4",
    "pywebpush==2.0.1",
    "email-validator==2.2.0",

    # --- Language detection (offline, no external API) ---
    "langdetect==1.0.9",

    # --- Speech: self-hosted STT (faster-whisper, CTranslate2-based, CPU/GPU) ---
    "faster-whisper==1.0.3",
    "soundfile==0.12.1",

    # --- Grapheme-to-phoneme (drives viseme/lip-sync timing) ---
    "g2p-en==2.1.0",
    "nltk==3.8.1",

    # NOTE: no piper-tts pip package. services/tts/main.py's PiperEngine
    # shells out to the standalone `piper` CLI binary (installed in
    # docker/Dockerfile.backend from piper's GitHub release) — it is never
    # `import`ed as a Python package. piper-tts on PyPI depends on
    # piper-phonemize, which has no installable wheel for any current
    # Python version; listing it here would break every fresh install.
    #
    # NOTE: no torch / transformers / openai-whisper / sentence-transformers.
    # faster-whisper (CTranslate2) + piper (ONNX) cover STT/TTS without the
    # multi-GB CUDA wheels those would pull in — this is what keeps the
    # single backend image light.
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "mypy==1.11.1",
    "black==24.4.2",
    "isort==5.13.2",
    "flake8==7.1.0",
    "faker==26.0.0",
    "factory-boy==3.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
