name: hermes_linguamind
description: Hermes LinguaMind - AI Language Learning Platform with a real-time voice AI companion
publish_to: 'none'
version: 1.0.0+10
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.24.0'
dependencies:
  animated_text_kit: ^4.2.3
  async: ^2.11.0
  audioplayers: ^6.4.0
  collection: ^1.18.0
  confetti: ^0.8.0
  connectivity_plus: ^7.1.1
  device_info_plus: ^13.1.0
  dio: ^5.8.0
  dio_cache_interceptor: ^3.5.1
  dio_cache_interceptor_hive_store: ^3.2.2
  equatable: ^2.0.7
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^19.2.0
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.2.0
  flutter_slidable: ^4.0.0
  flutter_staggered_animations: ^1.1.1
  flutter_webrtc: ^0.12.10
  freezed_annotation: ^3.0.0
  go_router: ^17.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.2
  intl: ^0.19.0
  json_annotation: ^4.9.0
  logger: ^2.5.0
  lottie: ^3.3.3
  package_info_plus: ^10.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  pull_to_refresh_flutter3: ^2.0.2
  record: ^6.0.0
  riverpod_annotation: ^2.6.1
  share_plus: ^13.1.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^2.0.1
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
dev_dependencies:
  build_runner: ^2.5.4
  custom_lint: ^0.7.5
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.4
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.4
  mocktail: ^1.0.4
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
    - assets/animations/
  fonts:
    # Real variable-font files (Inter & Space Grotesk, SIL OFL 1.1 licensed,
    # sourced from google/fonts). Flutter resolves the correct static
    # instance per declared `weight` from the single variable file.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
          weight: 700
